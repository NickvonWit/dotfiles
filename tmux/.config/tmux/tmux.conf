# Key bindings
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

set -g prefix C-s
set -g mouse on

# Pane navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# General settings
set-option -g status-position top

# Bootstrap tpm
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# Base plugins (always loaded)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'jaclu/tmux-menus'

# Catppuccin theme configuration
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"

# Detect if we're in an SSH session
if-shell '[ -n "$SSH_CLIENT" ] || [ -n "$SSH_TTY" ]' {
    # SSH status-right (date, time, and hostname)
    set -g status-right-length 100
    set -g status-right ""
    set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_green}] #h "
    set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}, none]│"
    set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_blue}] 󰭦 %Y-%m-%d 󰅐 %H:%M "
}

# For local sessions (non-SSH)
if-shell '[ -z "$SSH_CLIENT" ] && [ -z "$SSH_TTY" ]' {
    # Local session plugins (full set)
    set -g @plugin 'tmux-plugins/tmux-online-status'
    set -g @plugin 'tmux-plugins/tmux-battery'
    set -g @plugin 'jimeh/tmuxifier'
    set -g @plugin 'sainnhe/tmux-fzf'
    set -g @plugin 'tmux-plugins/tmux-cpu'
    set -g @plugin 'tmux-plugins/tmux-resurrect'
    set -g @plugin 'tmux-plugins/tmux-continuum'
    
    # Configure Online status
    set -g @online_icon "ok"
    set -g @offline_icon "nok"
    
    # Configure resurrect and continuum
    set -g @resurrect-capture-pane-contents 'on'
    set -g @resurrect-strategy-vim 'session'
    set -g @resurrect-strategy-nvim 'session'
    set -g @continuum-restore 'on'
    
    # Local status-right (with CPU, RAM, battery, etc.)
    set -g status-right-length 100
    set -g status-right ""
    set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_green}] CPU: #{cpu_percentage} "
    set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}, none]│"
    set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_yellow}] RAM: #{ram_percentage} "
    set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}, none]│"
    set -ga status-right "#{?#{e|>=:10,#{battery_percentage}},#{#[bg=#{@thm_red},fg=#{@thm_bg}]},#{#[bg=#{@thm_bg},fg=#{@thm_pink}]}} #{battery_icon} #{battery_percentage} "
    set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}, none]│"
    set -ga status-right "#[bg=#{@thm_bg}]#{?#{==:#{online_status},ok},#[fg=#{@thm_mauve}] 󰖩 on ,#[fg=#{@thm_red},bold]#[reverse] 󰖪 off }"
    set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}, none]│"
    set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_blue}] 󰭦 %Y-%m-%d 󰅐 %H:%M "
}

# Status left configuration
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{@thm_red},fg=#{@thm_bg},bold] 󰆍 #S },#{#[bg=#{@thm_bg},fg=#{@thm_green}] 󰆍 #S }}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_maroon}] 󰞷 #{pane_current_command} "
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_blue}] 󰉋 #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]#{?window_zoomed_flag,│,}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_yellow}]#{?window_zoomed_flag, 󰁌 zoom ,}"

# General tmux configuration
set -g status-position top
set -g status-style "bg=#{@thm_bg}"
set -g status-justify "absolute-centre"

# Pane border styling
setw -g pane-border-status top
setw -g pane-border-format ""
setw -g pane-active-border-style "bg=#{@thm_bg},fg=#{@thm_overlay_0}"
setw -g pane-border-style "bg=#{@thm_bg},fg=#{@thm_surface_0}"
setw -g pane-border-lines single

# Window styling
# 1. Auto-rename window (simple “Window” fallback)
set -g automatic-rename on
set -g automatic-rename-format "Window"

# 2. Separator glyph between entries
set -g window-status-separator "#[fg=#{@thm_overlay_0}]│"

# 3. Inactive windows
#    – bg stays default, fg = rosewater
set -g window-status-format \
  "#[fg=#{@thm_rosewater}] #I:#{?#{==:#{window_name},Window},#{window_index},#{window_name}} "

# 4. Active window
#    – bg = peach, fg = bg, bold
set -g window-status-current-format \
  "#[bg=#{@thm_peach},fg=#{@thm_bg},bold] #I:#{?#{==:#{window_name},Window},#{window_index},#{window_name}} "

# 5. Last window (the one you were in before current)
#    – same as inactive but fg = peach
set -g window-status-last-style "fg=#{@thm_peach}"

# 6. Windows with activity
#    – bg = red, fg = bg
set -g window-status-activity-style "bg=#{@thm_red},fg=#{@thm_bg}"

# 7. Bell-alerted windows
#    – same as activity, but bold
set -g window-status-bell-style "bg=#{@thm_red},fg=#{@thm_bg},bold"
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
