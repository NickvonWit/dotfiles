# Core Settings
unbind r
bind r source-file ~/.config/tmux/tmux.conf
set -g prefix C-s
set -g mouse on

# ===== FIX FOR NVIM COLORS =====
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
# ================================

# Vim-style pane navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Status bar position
set-option -g status-position top

# Default editor
set-environment -g VISUAL nvim
set-environment -g EDITOR nvim

# Bootstrap TPM
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# ===== PLUGINS =====
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux#v2.1.3'

# Optional plugins (comment out what you don't use)
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'

# ===== CATPPUCCIN THEME =====
set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_window_status_style "rounded"
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""

# Fix window text for all states
set -g @catppuccin_window_default_text " #W"     # For inactive windows
set -g @catppuccin_window_current_text " #W"     # For active window
set -g @catppuccin_window_text " #W"             # General fallback
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_current_fill "number"

# ===== CP Status =====
set -g status-right "#{E:@catppuccin_status_application}"
set -agF  status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
# Only display user and host if on a cluster
if-shell '[ -n "$SSH_CLIENT" ] || [ -n "$SSH_TTY" ]' {
  set -agF status-right "#{E:@catppuccin_status_host}"
}
set -agF status-right "#{E:@catppuccin_status_date_time}"

# ===== SESSION MANAGEMENT =====
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'

# Initialize TPM (keep at bottom)
run '~/.config/tmux/plugins/tpm/tpm'
